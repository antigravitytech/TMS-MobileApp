<script>
window.__TMS_FILES = {"Alumni.dc.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Class of 2006 Reunion<\/title>\n<script src=\"./support.js\"><\/script>\n<link rel=\"stylesheet\" href=\"./tms.css\">\n<link rel=\"stylesheet\" href=\"./ws.css\">\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\n.mtabs{padding-bottom:4px}\n<\/style>\n<\/helmet>\n<div class=\"app\">\n  <dc-import name=\"Theme\" ui=\"{{ false }}\" hint-size=\"0px,0px\"><\/dc-import>\n  <div class=\"top\" style=\"padding-bottom: 6px\">\n    <span class=\"ws-logo\" style=\"background: #86d6cb\">06<\/span>\n    <div class=\"grow\"><p class=\"xs mut\">Alumni association<\/p><p class=\"top-title ell\" style=\"font-size: 19px\">Class of 2006 Reunion<\/p><\/div>\n    <a href=\"Notifications.dc.html\" class=\"icon-btn\" aria-label=\"Notifications\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0\"><\/path><\/svg><span class=\"pip\"><\/span><\/a>\n  <\/div>\n  <div class=\"mtabs\" role=\"tablist\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\"><button class=\"{{ t.cls }}\" onClick=\"{{ t.pick }}\" role=\"tab\">{{ t.name }}<\/button><\/sc-for>\n  <\/div>\n  <div class=\"scroll px\" style=\"padding-top: 14px; padding-bottom: 30px\">\n    <sc-if value=\"{{ home.on }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"card hero rise\" style=\"border: 0; padding: 18px\">\n        <div style=\"position: relative; z-index: 1\">\n          <div class=\"row\" style=\"gap: 14px; align-items: flex-end\">\n            <div><p class=\"cd-n num\">38<\/p><p class=\"cd-l\" style=\"margin-top: 6px\">days to go<\/p><\/div>\n            <div class=\"grow\" style=\"text-align: right\"><span class=\"ws-chip\" style=\"background: #ffffff1f; color: #f3f5fe\">Alumni<\/span><p class=\"h2\" style=\"color: #f3f5fe; margin-top: 8px\">20th Anniversary<\/p><p class=\"xs\" style=\"color: #c9cbe0\">Sat, 2 Jan 2027 · 112 classmates<\/p><\/div>\n          <\/div>\n          <p class=\"sm\" style=\"color: #c9cbe0; margin-top: 14px\">Dues, committees and polls for your set, with a directory of classmates.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"kpis\" style=\"margin-top: 12px\">\n        <sc-for list=\"{{ home.cards }}\" as=\"k\" hint-placeholder-count=\"4\">\n          <button class=\"kpi\" onClick=\"{{ k.go }}\"><span class=\"{{ k.tile }}\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"{{ k.icon }}\"><\/path><\/svg><\/span><p class=\"k-n num\" style=\"font-size: 22px\">{{ k.big }}<\/p><p class=\"k-l\">{{ k.label }}<\/p><\/button>\n        <\/sc-for>\n      <\/div>\n      <div class=\"card row\" style=\"gap: 12px; margin-top: 12px\">\n        <div class=\"avs\"><span class=\"av sm a2\">DC<\/span><span class=\"av sm a4\">CE<\/span><span class=\"av sm\" style=\"background: var(--track); color: var(--fg)\">+3<\/span><\/div>\n        <div class=\"grow\"><p class=\"sm\" style=\"font-weight: 620\">2 of 5 sent today’s summary<\/p><p class=\"xs\" style=\"color: var(--st-ret)\">1 blocker raised<\/p><\/div>\n        <a href=\"Reports.dc.html\" class=\"mini-btn\">Reports<\/a>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ dues.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">What each member pledged and has paid towards the target.<\/p>\n      <div class=\"card hero\" style=\"border: 0; margin-top: 12px\">\n        <div class=\"row\" style=\"gap: 14px; position: relative; z-index: 1\">\n          <div class=\"grow\"><p class=\"xs\" style=\"color: #c9cbe0; font-weight: 600\">Collected<\/p><p class=\"money-big num\" style=\"color: #f3f5fe; margin-top: 4px\">{{ dues.got }}<\/p><p class=\"xs\" style=\"color: #c9cbe0; margin-top: 4px\">Target {{ dues.target }}<\/p><\/div>\n          <div class=\"ring2\" style=\"background: conic-gradient(#5fd3c4 {{ dues.deg }}deg, #ffffff22 0)\"><span>{{ dues.pct }}%<\/span><\/div>\n        <\/div>\n        <div class=\"trio\" style=\"position: relative; z-index: 1\"><div><p>Outstanding<\/p><p class=\"num\">{{ dues.out }}<\/p><\/div><div><p>Paid<\/p><p class=\"num\">{{ dues.nPaid }}<\/p><\/div><div><p>Still owing<\/p><p class=\"num\">{{ dues.nOwe }}<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"list\" style=\"margin-top: 12px\">\n        <sc-for list=\"{{ dues.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <div class=\"lrow\">\n            <span class=\"{{ r.av }}\">{{ r.ini }}<\/span>\n            <div class=\"grow\"><p class=\"h3 ell\">{{ r.name }}<\/p><p class=\"amt\"><b style=\"color: var(--fg)\">{{ r.paid }}<\/b> / {{ r.amt }}<\/p><div class=\"bar ok\"><i style=\"width: {{ r.w }}\"><\/i><\/div><\/div>\n            <sc-if value=\"{{ r.done }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"st st-done\">Paid<\/span><\/sc-if>\n            <sc-if value=\"{{ r.open }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"mini-btn pri\" onClick=\"{{ r.rec }}\">Record payment<\/button><\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <button class=\"btn btn-sec btn-block\" style=\"margin-top: 12px\" onClick=\"{{ dues.add }}\">+ Add pledge<\/button>\n    <\/sc-if>\n    <sc-if value=\"{{ comm.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">Committees, their leads and their to-dos.<\/p>\n      <div class=\"stack\" style=\"gap: 10px; margin-top: 12px\">\n        <sc-for list=\"{{ comm.list }}\" as=\"k\" hint-placeholder-count=\"3\">\n          <div class=\"card\">\n            <div class=\"row\" style=\"gap: 12px\"><span class=\"{{ k.tile }}\" style=\"width: 40px; height: 40px; border-radius: 13px; font-weight: 800\">{{ k.ini }}<\/span><div class=\"grow\"><p class=\"h3\">{{ k.name }}<\/p><p class=\"xs mut\">{{ k.lead }}<\/p><\/div><div class=\"avs\"><sc-for list=\"{{ k.avs }}\" as=\"a\" hint-placeholder-count=\"2\"><span class=\"{{ a.c }}\">{{ a.i }}<\/span><\/sc-for><\/div><\/div>\n            <div style=\"margin-top: 10px\">\n              <sc-for list=\"{{ k.todos }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <div class=\"row {{ t.wrap }}\" style=\"gap: 10px; padding: 6px 0\"><button class=\"{{ t.tick }}\" onClick=\"{{ t.toggle }}\" style=\"width: 24px; height: 24px\" aria-label=\"Done\"><svg class=\"i\" viewBox=\"0 0 24 24\" style=\"width: 12px; height: 12px\"><path d=\"m5 12 5 5 9-11\"><\/path><\/svg><\/button><p class=\"sm done-txt\">{{ t.name }}<\/p><\/div>\n              <\/sc-for>\n            <\/div>\n            <sc-if value=\"{{ k.noLead }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"mini-btn\" style=\"margin-top: 8px\" onClick=\"{{ k.pickLead }}\">Pick a lead<\/button><\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ poll.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">Ask everyone and see the results live.<\/p>\n      <div class=\"card\" style=\"margin-top: 12px\">\n        <div class=\"row\" style=\"gap: 8px\"><span class=\"ws-chip\">Poll · by you<\/span><span class=\"grow\"><\/span><span class=\"xs mut\">{{ poll.voted }} of 5 voted<\/span><\/div>\n        <p class=\"h2\" style=\"margin-top: 10px\">Aso-ebi colour<\/p>\n        <div class=\"stack\" style=\"gap: 8px; margin-top: 14px\">\n          <sc-for list=\"{{ poll.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button class=\"{{ o.cls }}\" onClick=\"{{ o.vote }}\"><em style=\"width: {{ o.w }}\"><\/em><span class=\"grow\">{{ o.name }}<\/span><span class=\"xs num\" style=\"font-weight: 750\">{{ o.pct }}%<\/span><\/button>\n          <\/sc-for>\n        <\/div>\n        <p class=\"xs mut\" style=\"margin-top: 12px\">{{ poll.line }}<\/p>\n      <\/div>\n      <button class=\"btn btn-sec btn-block\" style=\"margin-top: 12px\" onClick=\"{{ poll.newPoll }}\">+ New poll<\/button>\n    <\/sc-if>\n    <sc-if value=\"{{ notices.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">Announcements everyone sees, with how many have read them.<\/p>\n      <div class=\"card\" style=\"margin-top: 12px; padding: 12px\">\n        <textarea class=\"input\" rows=\"2\" style=\"border: 0; background: transparent; padding: 4px\" value=\"{{ notices.draft }}\" onChange=\"{{ notices.setDraft }}\" placeholder=\"Write a notice for everyone…\" aria-label=\"New notice\"><\/textarea>\n        <div class=\"row\" style=\"gap: 8px\"><span class=\"xs mut grow\">Goes to all 112 members<\/span><button class=\"mini-btn pri\" onClick=\"{{ notices.post }}\">Post<\/button><\/div>\n      <\/div>\n      <div class=\"stack\" style=\"gap: 10px; margin-top: 12px\">\n        <sc-for list=\"{{ notices.list }}\" as=\"n\" hint-placeholder-count=\"2\">\n          <div class=\"card\">\n            <div class=\"row\" style=\"gap: 10px\"><span class=\"tile amber\" style=\"width: 34px; height: 34px; border-radius: 11px\"><svg class=\"i s\" viewBox=\"0 0 24 24\"><path d=\"M4 10v4a1 1 0 0 0 1 1h3l5 4V5L8 9H5a1 1 0 0 0-1 1zM17 9a4 4 0 0 1 0 6\"><\/path><\/svg><\/span><p class=\"xs mut grow\">{{ n.when }}<\/p><\/div>\n            <p class=\"sm\" style=\"margin-top: 10px; font-weight: 560; line-height: 1.5\">{{ n.text }}<\/p>\n            <div class=\"row\" style=\"gap: 10px; margin-top: 12px\"><div class=\"bar teal grow\" style=\"height: 5px\"><i style=\"width: {{ n.w }}\"><\/i><\/div><span class=\"xs mut num\">Read by {{ n.read }} of 112<\/span><\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ dir.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">Classmates, where they are and who’s active.<\/p>\n      <div class=\"kpis\" style=\"grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px\">\n        <sc-for list=\"{{ dir.counts }}\" as=\"k\" hint-placeholder-count=\"3\"><div class=\"kpi\" style=\"min-height: 70px; padding: 10px; cursor: default\"><p class=\"k-n num\" style=\"font-size: 20px; color: {{ k.c }}\">{{ k.n }}<\/p><p class=\"k-l\" style=\"font-size: 11.5px\">{{ k.name }}<\/p><\/div><\/sc-for>\n      <\/div>\n      <div class=\"list\" style=\"margin-top: 12px\">\n        <sc-for list=\"{{ dir.rows }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div class=\"lrow\" style=\"flex-wrap: wrap\">\n            <span class=\"{{ p.av }}\">{{ p.ini }}<\/span>\n            <div class=\"grow\"><p class=\"h3\">{{ p.name }}<\/p><p class=\"xs mut\">{{ p.sub }}<\/p><\/div>\n            <div class=\"seg\" style=\"width: 100%; padding: 3px; margin-top: 10px\"><sc-for list=\"{{ p.opts }}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{ o.cls }}\" onClick=\"{{ o.pick }}\" style=\"height: 32px; font-size: 12.5px\">{{ o.name }}<\/button><\/sc-for><\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <button class=\"btn btn-sec btn-block\" style=\"margin-top: 12px\" onClick=\"{{ dir.add }}\">+ Add classmate<\/button>\n    <\/sc-if>\n  <\/div>\n  <sc-if value=\"{{ dues.sheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"scrim\" onClick=\"{{ dues.close }}\" aria-label=\"Close\"><\/button>\n    <div class=\"sheet\">\n      <div class=\"grab\"><\/div>\n      <p class=\"xs mut\">Record payment<\/p><p class=\"h2\" style=\"margin-top: 2px\">{{ dues.sName }}<\/p><p class=\"sm mut\" style=\"margin-top: 4px\">Balance {{ dues.sBal }}<\/p>\n      <div class=\"row\" style=\"gap: 8px; margin-top: 14px; flex-wrap: wrap\"><sc-for list=\"{{ dues.amts }}\" as=\"a\" hint-placeholder-count=\"3\"><button class=\"{{ a.cls }}\" onClick=\"{{ a.pick }}\">{{ a.name }}<\/button><\/sc-for><\/div>\n      <p class=\"label\" style=\"margin-top: 16px\">Paid with<\/p>\n      <div class=\"seg\"><sc-for list=\"{{ dues.methods }}\" as=\"x\" hint-placeholder-count=\"3\"><button class=\"{{ x.cls }}\" onClick=\"{{ x.pick }}\">{{ x.name }}<\/button><\/sc-for><\/div>\n      <button class=\"btn btn-pri btn-block\" style=\"margin-top: 18px\" onClick=\"{{ dues.confirm }}\">Record {{ dues.sAmt }}<\/button>\n    <\/div>\n  <\/sc-if>\n  <sc-if value=\"{{ qaOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"qa-scrim\" onClick=\"{{ closeQa }}\" aria-label=\"Close quick add\"><\/button>\n    <div class=\"qa-glow\" aria-hidden=\"true\"><\/div>\n    <div class=\"qa-head\"><p class=\"eyebrow\" style=\"color: var(--b300)\">Quick add<\/p><p class=\"qa-title\">What does the<br><span>set<\/span> need?<\/p><\/div>\n    <nav class=\"qa-dial\" aria-label=\"Quick add\">\n      <sc-for list=\"{{ qa }}\" as=\"q\" hint-placeholder-count=\"6\">\n        <a href=\"{{ q.href }}\" onClick=\"{{ q.act }}\" class=\"qa-it\" style=\"bottom: {{ q.b }}px; right: {{ q.r }}px; --dx: {{ q.dx }}px; --dy: {{ q.dy }}px; --tilt: {{ q.t }}deg; animation-delay: {{ q.d }}s\">\n          <span class=\"qa-lbl\">{{ q.name }}<\/span>\n          <span class=\"qa-bub\" style=\"background: {{ q.c }}\"><svg class=\"i l\" viewBox=\"0 0 24 24\" style=\"stroke-width: 2\"><path d=\"{{ q.icon }}\"><\/path><\/svg><\/span>\n        <\/a>\n      <\/sc-for>\n    <\/nav>\n  <\/sc-if>\n  <button class=\"{{ fabCls }}\" onClick=\"{{ toggleQa }}\" aria-label=\"Quick add\" aria-expanded=\"{{ qaOpen }}\"><svg class=\"i l\" viewBox=\"0 0 24 24\" style=\"stroke-width: 2.4\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg><\/button>\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"toast\" role=\"status\"><span class=\"t-ic\"><svg class=\"i s\" viewBox=\"0 0 24 24\" style=\"stroke-width: 3\"><path d=\"m5 12 5 5 9-11\"><\/path><\/svg><\/span><span class=\"grow\">{{ toast }}<\/span><\/div>\n  <\/sc-if>\n  <dc-import name=\"TabBar\" kind=\"special\" active=\"home\" home=\"Alumni.dc.html\" hint-size=\"390px,88px\"><\/dc-import>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const tab = st.tab || 'home';\n    const N = (n) => '₦' + Math.round(n).toLocaleString('en-US');\n    const toast = (t) => { this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2400); };\n    const home = (() => {\n      const C = [[\"₦650k\", \"Dues of ₦6m · 3 owing\", \"dues\", \"tile green\", \"M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 10h18M7 15h3\"], [\"6\", \"Committees · 10 to-dos\", \"comm\", \"tile teal\", \"M5.5 8a3.5 3.5 0 1 0 7 0 3.5 3.5 0 0 0-7 0M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6\"], [\"75%\", \"Emerald green leads the aso-ebi poll\", \"poll\", \"tile\", \"M4 20V10M10 20V4M16 20v-7M21 20H3\"], [\"3/4\", \"Active classmates\", \"dir\", \"tile sky\", \"M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM8 7h6M8 11h6\"]];\n      return { on: tab === 'home', cards: C.map(([big, label, t, tile, icon]) => ({ big, label, tile, icon, go: () => this.setState({ tab: t }) })) };\n    })();\n    const dues = (() => {\n      const rows = st.dues_rows || [[\"Dayo Coker\", \"DC\", 100000, 100000], [\"Chinwe Eke\", \"CE\", 50000, 100000], [\"Ibrahim Musa\", \"IM\", 250000, 250000], [\"Bola A.\", \"BA\", 0, 100000], [\"Kemi O.\", \"KO\", 150000, 150000], [\"Uche N.\", \"UN\", 100000, 100000], [\"Segun T.\", \"ST\", 0, 50000]];\n      const got = rows.reduce((a, r) => a + r[2], 0) + 0, tgt = 6000000;\n      const owe = rows.filter((r) => r[2] < r[3]);\n      const sel = rows.find((r) => r[0] === st.dues_sel);\n      const bal = sel ? sel[3] - sel[2] : 0, ch = st.dues_amt || 'full', meth = st.dues_m || 'Transfer';\n      const amt = ch === 'full' ? bal : Math.round(bal / 2);\n      const avs = ['a1', 'a2', 'a3', 'a4', 'a5', 'a6', 'a7'];\n      return {\n        on: tab === 'dues levies.pct }}%<\/span><\/div>\n        <\/div>\n        <div class=\"trio\" style=\"position: relative; z-index: 1\"><div><p>Outstanding<\/p><p class=\"num\">{{ levies.out }}<\/p><\/div><div><p>Paid<\/p><p class=\"num\">{{ levies.nPaid }}<\/p><\/div><div><p>Still owing<\/p><p class=\"num\">{{ levies.nOwe }}<\/p><\/div><\/div>\n      <\/div>\n      <div class=\"list\" style=\"margin-top: 12px\">\n        <sc-for list=\"{{ levies.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <div class=\"lrow\">\n            <span class=\"{{ r.av }}\">{{ r.ini }}<\/span>\n            <div class=\"grow\"><p class=\"h3 ell\">{{ r.name }}<\/p><p class=\"amt\"><b style=\"color: var(--fg)\">{{ r.paid }}<\/b> / {{ r.amt }}<\/p><div class=\"bar ok\"><i style=\"width: {{ r.w }}\"><\/i><\/div><\/div>\n            <sc-if value=\"{{ r.done }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"st st-done\">Paid<\/span><\/sc-if>\n            <sc-if value=\"{{ r.open }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"mini-btn pri\" onClick=\"{{ r.rec }}\">Record levy<\/button><\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <button class=\"btn btn-sec btn-block\" style=\"margin-top: 12px\" onClick=\"{{ levies.add }}\">+ Add house<\/button>\n    <\/sc-if>\n    <sc-if value=\"{{ passes.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">Expected visitors and their access codes for security.<\/p>\n      <div class=\"stack\" style=\"gap: 10px; margin-top: 12px\">\n        <sc-for list=\"{{ passes.list }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div class=\"card {{ p.anim }}\">\n            <div class=\"row\" style=\"gap: 12px\"><div class=\"dblock\"><p>{{ p.m }}<\/p><p>{{ p.d }}<\/p><\/div><div class=\"grow\"><p class=\"h3\">{{ p.who }}<\/p><p class=\"xs mut\">{{ p.when }}<\/p><\/div><span class=\"{{ p.st }}\">{{ p.status }}<\/span><\/div>\n            <div class=\"row\" style=\"gap: 10px; margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: var(--tint); border: 1px dashed var(--line3)\"><p class=\"xs mut grow\">Gate code<\/p><p class=\"code num\">{{ p.code }}<\/p><\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <button class=\"btn btn-pri btn-block\" style=\"margin-top: 12px\" onClick=\"{{ passes.open }}\">+ New gate pass<\/button>\n    <\/sc-if>\n    <sc-if value=\"{{ issues.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">Things that need fixing around the estate.<\/p>\n      <div class=\"row\" style=\"gap: 8px; margin-top: 12px; flex-wrap: wrap\"><sc-for list=\"{{ issues.filters }}\" as=\"f\" hint-placeholder-count=\"4\"><button class=\"{{ f.cls }}\" onClick=\"{{ f.pick }}\">{{ f.name }} <span class=\"n\">{{ f.n }}<\/span><\/button><\/sc-for><\/div>\n      <div class=\"stack\" style=\"gap: 10px; margin-top: 12px\">\n        <sc-for list=\"{{ issues.items }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div class=\"{{ t.cls }}\" style=\"display: flex; gap: 12px; align-items: center\">\n            <button class=\"{{ t.tick }}\" onClick=\"{{ t.done }}\" aria-label=\"Mark done\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m5 12 5 5 9-11\"><\/path><\/svg><\/button>\n            <div class=\"grow\"><p class=\"h3 done-txt\">{{ t.title }}<\/p><p class=\"xs mut\" style=\"margin-top: 3px\">{{ t.meta }}<\/p><\/div>\n            <button class=\"{{ t.st }}\" onClick=\"{{ t.cycle }}\" style=\"border: 0; cursor: pointer\">{{ t.status }}<\/button>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <div class=\"row\" style=\"gap: 8px; margin-top: 12px\">\n        <input class=\"input\" style=\"height: 50px\" value=\"{{ issues.draft }}\" onChange=\"{{ issues.setDraft }}\" placeholder=\"Report an issue, e.g. Water leak by Gate 2\" aria-label=\"Report an issue\">\n        <button class=\"btn btn-pri btn-sm\" style=\"height: 50px\" onClick=\"{{ issues.add }}\">Add<\/button>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ notices.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">Announcements everyone sees, with how many have read them.<\/p>\n      <div class=\"card\" style=\"margin-top: 12px; padding: 12px\">\n        <textarea class=\"input\" rows=\"2\" style=\"border: 0; background: transparent; padding: 4px\" value=\"{{ notices.draft }}\" onChange=\"{{ notices.setDraft }}\" placeholder=\"Write a notice for everyone…\" aria-label=\"New notice\"><\/textarea>\n        <div class=\"row\" style=\"gap: 8px\"><span class=\"xs mut grow\">Goes to all 64 members<\/span><button class=\"mini-btn pri\" onClick=\"{{ notices.post }}\">Post<\/button><\/div>\n      <\/div>\n      <div class=\"stack\" style=\"gap: 10px; margin-top: 12px\">\n        <sc-for list=\"{{ notices.list }}\" as=\"n\" hint-placeholder-count=\"2\">\n          <div class=\"card\">\n            <div class=\"row\" style=\"gap: 10px\"><span class=\"tile amber\" style=\"width: 34px; height: 34px; border-radius: 11px\"><svg class=\"i s\" viewBox=\"0 0 24 24\"><path d=\"M4 10v4a1 1 0 0 0 1 1h3l5 4V5L8 9H5a1 1 0 0 0-1 1zM17 9a4 4 0 0 1 0 6\"><\/path><\/svg><\/span><p class=\"xs mut grow\">{{ n.when }}<\/p><\/div>\n            <p class=\"sm\" style=\"margin-top: 10px; font-weight: 560; line-height: 1.5\">{{ n.text }}<\/p>\n            <div class=\"row\" style=\"gap: 10px; margin-top: 12px\"><div class=\"bar teal grow\" style=\"height: 5px\"><i style=\"width: {{ n.w }}\"><\/i><\/div><span class=\"xs mut num\">Read by {{ n.read }} of 64<\/span><\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ poll.on }}\" hint-placeholder-val=\"{{ false }}\">\n      <p class=\"sm mut\">Ask everyone and see the results live.<\/p>\n      <div class=\"card\" style=\"margin-top: 12px\">\n        <div class=\"row\" style=\"gap: 8px\"><span class=\"ws-chip\">Poll · by Ibrahim<\/span><span class=\"grow\"><\/span><span class=\"xs mut\">{{ poll.voted }} of 6 voted<\/span><\/div>\n        <p class=\"h2\" style=\"margin-top: 10px\">Upgrade the gate to card access?<\/p>\n        <div class=\"stack\" style=\"gap: 8px; margin-top: 14px\">\n          <sc-for list=\"{{ poll.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button class=\"{{ o.cls }}\" onClick=\"{{ o.vote }}\"><em style=\"width: {{ o.w }}\"><\/em><span class=\"grow\">{{ o.name }}<\/span><span class=\"xs num\" style=\"font-weight: 750\">{{ o.pct }}%<\/span><\/button>\n          <\/sc-for>\n        <\/div>\n        <p class=\"xs mut\" style=\"margin-top: 12px\">{{ poll.line }}<\/p>\n      <\/div>\n      <button class=\"btn btn-sec btn-block\" style=\"margin-top: 12px\" onClick=\"{{ poll.newPoll }}\">+ New poll<\/button>\n    <\/sc-if>\n  <\/div>\n  <sc-if value=\"{{ levies.sheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"scrim\" onClick=\"{{ levies.close }}\" aria-label=\"Close\"><\/button>\n    <div class=\"sheet\">\n      <div class=\"grab\"><\/div>\n      <p class=\"xs mut\">Record levy<\/p><p class=\"h2\" style=\"margin-top: 2px\">{{ levies.sName }}<\/p><p class=\"sm mut\" style=\"margin-top: 4px\">Balance {{ levies.sBal }}<\/p>\n      <div class=\"row\" style=\"gap: 8px; margin-top: 14px; flex-wrap: wrap\"><sc-for list=\"{{ levies.amts }}\" as=\"a\" hint-placeholder-count=\"3\"><button class=\"{{ a.cls }}\" onClick=\"{{ a.pick }}\">{{ a.name }}<\/button><\/sc-for><\/div>\n      <p class=\"label\" style=\"margin-top: 16px\">Paid with<\/p>\n      <div class=\"seg\"><sc-for list=\"{{ levies.methods }}\" as=\"x\" hint-placeholder-count=\"3\"><button class=\"{{ x.cls }}\" onClick=\"{{ x.pick }}\">{{ x.name }}<\/button><\/sc-for><\/div>\n      <button class=\"btn btn-pri btn-block\" style=\"margin-top: 18px\" onClick=\"{{ levies.confirm }}\">Record {{ levies.sAmt }}<\/button>\n    <\/div>\n  <\/sc-if>\n  <sc-if value=\"{{ passes.sheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"scrim\" onClick=\"{{ passes.close }}\" aria-label=\"Close Day<\/label><select id=\"bd\" class=\"input\"><option>23<\/option><\/select><\/div>\n          <div class=\"grow\"><label class=\"label\" for=\"bm\">Month<\/label><select id=\"bm\" class=\"input\"><option>November<\/option><\/select><\/div>\n        <\/div>\n        <div style=\"margin-top: 14px\"><label class=\"label\" for=\"by\">Year <span class=\"dim\">· private to you<\/span><\/label><select id=\"by\" class=\"input\"><option>1997<\/option><\/select><\/div>\n        <p class=\"label\" style=\"margin-top: 18px\">Who sees it<\/p>\n        <div class=\"seg\">\n          <button class=\"{{ visCol }}\" onClick=\"{{ setCol }}\">My colleagues<\/button>\n          <button class=\"{{ visNone }}\" onClick=\"{{ setNone }}\">Nobody<\/button>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ s2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"slideL\">\n        <p class=\"eyebrow\">Stay in the loop<\/p>\n        <h1 class=\"title\" style=\"margin-top: 8px\">Only the nudges<br>that matter<\/h1>\n        <p class=\"mut\" style=\"margin-top: 10px\">Tune these any time in Settings.<\/p>\n        <div class=\"list\" style=\"margin-top: 22px\">\n          <sc-for list=\"{{ notifs }}\" as=\"n\" hint-placeholder-count=\"5\">\n            <div class=\"li\" style=\"cursor: default\">\n              <span class=\"{{ n.tile }}\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"{{ n.icon }}\"><\/path><\/svg><\/span>\n              <div class=\"grow\"><p class=\"h3\">{{ n.name }}<\/p><p class=\"xs mut\">{{ n.desc }}<\/p><\/div>\n              <button class=\"{{ n.cls }}\" onClick=\"{{ n.toggle }}\" aria-pressed=\"{{ n.on }}\" aria-label=\"{{ n.name }}\"><\/button>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding-top: 90px; text-align: center; position: relative\">\n        <div class=\"confetti\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; pointer-events: none\">\n          <i style=\"left: 12%; top: 40px; background: #9184d9\"><\/i><i style=\"left: 28%; top: 10px; background: #2bb3a3; animation-delay: .2s\"><\/i><i style=\"left: 46%; top: 30px; background: oklch(81% .12 80); animation-delay: .1s\"><\/i><i style=\"left: 64%; top: 0; background: #c2449b; animation-delay: .3s\"><\/i><i style=\"left: 80%; top: 36px; background: var(--b300); animation-delay: .15s\"><\/i><i style=\"left: 90%; top: 6px; background: oklch(75% .11 245); animation-delay: .35s\"><\/i>\n        <\/div>\n        <div class=\"pop\" style=\"width: 112px; height: 112px; border-radius: 36px; margin: 0 auto; background: #9184d9; color: #161826; display: grid; place-items: center; box-shadow: 0 30px 60px -20px #9184d9\">\n          <svg viewBox=\"0 0 24 24\" style=\"width: 56px; height: 56px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; animation: draw .7s .3s ease-out both\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-11\"><\/path><\/svg>\n        <\/div>\n        <h1 class=\"title rise d2\" style=\"margin-top: 30px\">You're all set, Chioma<\/h1>\n        <p class=\"mut rise d3\" style=\"margin-top: 10px\">Acme Group is ready. Here's what's waiting for you today.<\/p>\n        <div class=\"list rise d4\" style=\"margin-top: 26px; text-align: left\">\n          <div class=\"li\" style=\"cursor: default\"><span class=\"tile sky\"><svg class=\"i\" viewBox=\"0 0 24 24\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"4.5\"><\/rect><path d=\"m8.5 12 2.5 2.5 4.5-5\"><\/path><\/svg><\/span><p class=\"grow h3\">1 task due today<\/p><\/div>\n          <div class=\"li\" style=\"cursor: default\"><span class=\"tile amber\"><svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\/circle><path d=\"m8.5 12 2.5 2.5 4.5-5\"><\/path><\/svg><\/span><p class=\"grow h3\">3 waiting for your review<\/p><\/div>\n          <div class=\"li\" style=\"cursor: default\"><span class=\"tile teal\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"><\/path><\/svg><\/span><p class=\"grow h3\">Daily report due by 5:00 pm<\/p><\/div>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n  <\/div>\n\n  <div class=\"px\" style=\"padding-bottom: 36px; padding-top: 12px\">\n    <sc-if value=\"{{ notDone }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"stack\" style=\"gap: 6px\">\n        <button class=\"btn btn-pri btn-block\" onClick=\"{{ next }}\">{{ cta }}<\/button>\n        <button class=\"btn btn-block\" onClick=\"{{ next }}\" style=\"background: transparent; color: var(--mut)\">Skip for now<\/button>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n      <a href=\"Home.dc.html\" class=\"btn btn-pri btn-block pop d5\">Go to my day <svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg><\/a>\n    <\/sc-if>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const st = this.state || {};\n    const s = st.s || 0;\n    const roles = st.roles || { Member: true, 'Line manager': true, 'Project manager': false, 'Team lead': true };\n    const nt = st.nt || { rev: true, men: true, rep: true, clk: false, bd: true };\n    const vis = st.vis || 'col';\n    const nd = [\n      { k: 'rev', name: 'Reviews & approvals', desc: 'When work is submitted, approved or returned', tile: 'tile amber', icon: 'M3.5 12a8.5 8.5 0 1 0 17 0 8.5 8.5 0 0 0-17 0M8.5 12l2.5 2.5 4.5-5' },\n      { k: 'men', name: 'Mentions & chat', desc: 'Direct messages and @mentions', tile: 'tile', icon: 'M20.5 12a8 8 0 0 1-11.6 7.1L3.5 20.5l1.4-5.1A8 8 0 1 1 20.5 12z' },\n      { k: 'rep', name: 'Daily report reminder', desc: 'Weekdays at 4:30 pm', tile: 'tile teal', icon: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' },\n      { k: 'clk', name: 'Clock-in reminder', desc: 'Weekdays at 8:45 am', tile: 'tile sky', icon: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17M12 7.5V12l3 2' },\n      { k: 'bd', name: 'Birthdays', desc: 'On the day, so you can send a card', tile: 'tile rose', icon: 'M4 21v-8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8M3 21h18M12 7v4' }\n    ];\n    return {\n      s0: s === 0, s1: s === 1, s2: s === 2, done: s === 3, notDone: s < 3, first: s === 0, notFirst: s > 0 && s < 3,\n      pct: ((s + 2) / 4 * 100) + '%', stepLabel: (s + 2) + ' of 4',\n      cta: s === 2 ? 'Finish setup' : 'Continue',\n      next: () => this.setState({ s: Math.min(3, s + 1) }),\n      back: () => this.setState({ s: Math.max(0, s - 1) }),\n      roles: Object.keys(roles).map((name) => ({ name, on: roles[name], cls: roles[name] ? 'chip on' : 'chip', toggle: () => this.setState({ roles: { ...roles, [name]: !roles[name] } }) })),\n      ...(() => {\n        const col = st.col || 'a1', fn = st.fn ?? 'Chioma', ln = st.ln ?? 'Okafor';\n        return {\n          fn, ln, setFn: (e) => this.setState({ fn: e.target.value }), setLn: (e) => this.setState({ ln: e.target.value }),\n          initials: ((fn[0] || '') + (ln[0] || '')).toUpperCase() || '?', avCls: 'av xl ' + col,\n          swatches: ['a1', 'a2', 'a3', 'a4', 'a5', 'a6'].map((a, i) => ({ a, name: 'Colour ' + (i + 1), cls: a === col ? 'swb on' : 'swb', pick: () => this.setState({ col: a }) }))\n        };\n      })(),\n      visCol: vis === 'col' ? 'on' : '', visNone: vis === 'none' ? 'on' : '',\n      setCol: () => this.setState({ vis: 'col' }), setNone: () => this.setState({ vis: 'none' }),\n      notifs: nd.map((n) => ({ ...n, on: nt[n.k], cls: nt[n.k] ? 'toggle on' : 'toggle', toggle: () => this.setState({ nt: { ...nt, [n.k]: !nt[n.k] } }) }))\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Projects.dc.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Projects<\/title>\n<script src=\"./support.js\"><\/script>\n<link rel=\"stylesheet\" href=\"./tms.css\">\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\n.pc{width:100%;text-align:left;cursor:pointer;color:var(--fg);display:block}\n.meter{display:flex;flex-direction:column;gap:6px;flex:1}\n<\/style>\n<\/helmet>\n<div class=\"app\">\n  <dc-import name=\"Theme\" ui=\"{{ false }}\" hint-size=\"0px,0px\"><\/dc-import>\n  <div class=\"row px\" style=\"padding-top: 58px; padding-bottom: 8px; gap: 10px\">\n    <a href=\"More.dc.html\" class=\"icon-btn\" aria-label=\"Back\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m15 6-6 6 6 6\"><\/path><\/svg><\/a>\n    <h1 class=\"top-title grow\">Projects<\/h1>\n    <button class=\"icon-btn\" aria-label=\"New project\" style=\"background: #9184d9; color: #161826; border: 0\"><svg class=\"i\" viewBox=\"0 0 24 24\" style=\"stroke-width: 2.4\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg><\/button>\n  <\/div>\n  <div class=\"hscroll\" style=\"padding-top: 6px\">\n    <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\"><button class=\"{{ f.cls }}\" onClick=\"{{ f.pick }}\"><span style=\"width: 8px; height: 8px; border-radius: 50%; background: {{ f.dot }}\"><\/span>{{ f.name }}<span class=\"n\">{{ f.n }}<\/span><\/button><\/sc-for>\n  <\/div>\n  <div class=\"scroll px stack\" style=\"gap: 12px; padding-top: 14px; padding-bottom: 30px\">\n    <sc-for list=\"{{ list }}\" as=\"p\" hint-placeholder-count=\"4\">\n      <div class=\"card rise\"><button class=\"pc\" style=\"background: none; border: 0; padding: 0\" onClick=\"{{ p.toggle }}\" aria-expanded=\"{{ p.open }}\">\n        <div class=\"row\" style=\"gap: 8px\"><span class=\"{{ p.st }}\">{{ p.health }}<\/span><span class=\"tag\">{{ p.level }}<\/span><span class=\"grow\"><\/span><span class=\"av sm {{ p.a }}\">{{ p.ini }}<\/ "text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const st = this.state || {};\n    const f = st.f || 'all';\n    const open = st.open ?? 'cp';\n    const H = { off: ['st st-od', 'Off track'], risk: ['st st-sub', 'At risk'] };\n    const P = [\n      { id: 'cp', name: 'Customer Portal Revamp', h: 'off', level: 'Simple', ms: 'Discovery', promised: '26 Oct', forecast: '20 Nov', late: '19 working days late', done: 36, acc: 0, ini: 'CO', a: 'a1' },\n      { id: 'pos', name: 'POS rollout — Lagos, Abuja, Kano', h: 'off', level: 'Advanced', ms: 'Abuja live', promised: '10 Nov', forecast: '25 Nov', late: '11 working days late', done: 40, acc: 40, ini: 'IM', a: 'a5' },\n      { id: 'mob', name: 'Mobile App Launch', h: 'risk', level: 'Simple', ms: 'Beta', promised: '26 Nov', forecast: '30 Nov', late: '2 working days late', done: 25, acc: 0, ini: 'CO', a: 'a1' },\n      { id: 'web', name: 'Website — Unique Engineering', h: 'risk', level: 'Intermediate', ms: 'Go-live', promised: '15 Dec', forecast: '18 Dec', late: '3 working days late', done: 32, acc: 33, ini: 'CO', a: 'a1' }\n    ];\n    const fl = [['all', 'All', 'var(--b300)'], ['off', 'Off track', 'oklch(71% .15 22)'], ['risk', 'At risk', 'oklch(81% .12 80)']];\n    return {\n      filters: fl.map(([k, name, dot]) => ({ name, dot, n: k === 'all' ? P.length : P.filter((p) => p.h === k).length, cls: k === f ? 'chip on' : 'chip', pick: () => this.setState({ f: k }) })),\n      list: P.filter((p) => f === 'all' || p.h === f).map((p) => ({ ...p, st: H[p.h][0], health: H[p.h][1], open: open === p.id, toggle: () => this.setState({ open: open === p.id ? '' : p.id }) }))\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Reports.dc.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Daily reports<\/title>\n<script src=\"./support.js\"><\/script>\n<link rel=\"stylesheet\" href=\"./tms.css\">\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap\" rel=\"stylesheet\">\n<style>body{margin:0}<\/style>\n<\/helmet>\n<div class=\"app\">\n  <dc-import name=\"Theme\" ui=\"{{ false }}\" hint-size=\"0px,0px\"><\/dc-import>\n  <div class=\"row px\" style=\"padding-top: 58px; padding-bottom: 8px; gap: 10px\">\n    <a href=\"Home.dc.html\" class=\"icon-btn\" aria-label=\"Back\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m15 6-6 6 6 6\"><\/path><\/svg><\/a>\n    <h1 class=\"top-title grow\">Reports<\/h1>\n    <a href=\"Performance.dc.html\" class=\"txt-btn\" style=\"display: flex; align-items: center\">Performance<\/a>\n  <\/div>\n  <div class=\"px\"><div class=\"seg\">\n    <button class=\"{{ cLog }}\" onClick=\"{{ toLog }}\">Log today<\/button>\n    <button class=\"{{ cSum }}\" onClick=\"{{ toSum }}\">Team summaries<\/button>\n  <\/div><\/div>\n\n  <div class=\"scroll px\" style=\"padding-bottom: 30px\">\n    <sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"rise\" style=\"padding-top: 18px\">\n        <div class=\"row\" style=\"gap: 12px\">\n          <span class=\"tile teal\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"><\/path><\/svg><\/span>\n          <div class=\"grow\"><p class=\"h3\">Daily Status Update<\/p><p class=\"xs mut\">For Ibrahim Musa<\/p><\/div>\n          <span class=\"st st-sub\">Due 5:00 pm<\/span>\n        <\/div>\n        <div style=\"margin-top: 20px\"><label class=\"label\" for=\"d1\">What did you get done today?<\/label><textarea id=\"d1\" class=\"input\" rows=\"3\">Shortlisted 6 backend candidates. Drafted the Q4 hiring budget.<\/textarea><\/div>\n        <div style=\"margin-top: 14px\"><label class=\"label\" for=\"d2\">What's next?<\/label><textarea id=\"d2\" class=\"input\" rows=\"2\" placeholder=\"Tomorrow's focus\"><\/textarea><\/div>\n        <p class=\"label\" style=\"margin-top: 14px\">Link to a project<\/p>\n        <div class=\"row\" style=\"gap: 8px; flex-wrap: wrap\">\n          <sc-for list=\"{{ projs }}\" as=\"p\" hint-placeholder-count=\"3\"><button class=\"{{ p.cls }}\" onClick=\"{{ p.pick }}\">{{ p.name }}<\/button><\/sc-for>\n        <\/div>\n        <div class=\"card row\" style=\"gap: 12px; margin-top: 16px\">\n          <span class=\"tile rose\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\/path><\/svg><\/span>\n          <div class=\"grow\"><p class=\"h3\">I'm blocked<\/p><p class=\"xs mut\">Flags it to Ibrahim straight away<\/p><\/div>\n          <button class=\"{{ blkCls }}\" onClick=\"{{ toggleBlk }}\" aria-pressed=\"{{ blk }}\" aria-label=\"I'm blocked\"><\/button>\n        <\/div>\n        <sc-if value=\"{{ blk }}\" hint-placeholder-val=\"{{ false }}\">\n          <textarea class=\"input rise\" rows=\"2\" style=\"margin-top: 10px; border-color: color-mix(in oklch, oklch(71% .15 22) 50%, transparent)\" placeholder=\"What's in the way, and who can unblock it?\"><\/textarea>\n        <\/sc-if>\n        <button class=\"btn btn-pri btn-block\" style=\"margin-top: 20px\" onClick=\"{{ submit }}\">Send report<\/button>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align: center; padding-top: 60px\">\n        <div class=\"pop\" style=\"width: 100px; height: 100px; margin: 0 auto; border-radius: 34px; background: #2bb3a3; color: #08221f; display: grid; place-items: center; box-shadow: 0 30px 60px -22px #2bb3a3\">\n          <svg viewBox=\"0 0 24 24\" style=\"width: 50px; height: 50px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; animation: draw .6s .25s ease-out both\" aria-hidden=\"true\"><path d=\"m5 12 5 5 9-11\"><\/path><\/svg>\n        <\/div>\n        <p class=\"title rise d2\" style=\"margin-top: 24px\">Report sent<\/p>\n        <p class=\"mut rise d3\" style=\"margin-top: 8px\">Ibrahim has it. That's 4 of 6 this week.<\/p>\n        <div class=\"card row rise d4\" style=\"gap: 12px; margin-top: 24px; text-align: left\">\n          <svg class=\"i l\" viewBox=\"0 0 24 24\" style=\"color: var(--st-ret)\"><path d=\"M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 1-6 1-9z\"><\/path><\/svg>\n          <div class=\"grow\"><p class=\"h3\">+10 points<\/p><p class=\"xs mut\">On time, before 5:00 pm<\/p><\/div>\n        <\/div>\n        <a href=\"Home.dc.html\" class=\"btn btn-sec btn-block rise d5\" style=\"margin-top: 14px\">Done<\/a>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ isSum }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"rise\" style=\"padding-top: 16px\">\n        <div class=\"card hero\" style=\"border: 0; background-color: #262a60\">\n          <div style=\"position: relative; z-index: 1\">\n            <p class=\"sm\" style=\"color: #c9cbe0\">Today · Tech Team<\/p>\n            <p class=\"h2\" style=\"margin-top: 2px\">2 of 5 sent · 1 blocker<\/p>\n            <div class=\"progress\" style=\"margin-top: 12px; background: #ffffff1f\"><i style=\"width: 40%; background: #f3f5fe\"><\/i><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"stack\" style=\"gap: 10px; margin-top: 14px\">\n          <div class=\"card\">\n            <div class=\"row\" style=\"gap: 12px\"><span class=\"av a2\">TB<\/span><div class=\"grow\"><p class=\"h3\">Tunde<\/p><p class=\"xs mut\">100% this month · 10-day streak<\/p><\/div><span class=\"st st-done\">On time<\/span><\/div>\n            <p class=\"sm\" style=\"margin-top: 12px\"><span class=\"mut\">Done:<\/span> Wrote tests for the payment flow<\/p>\n            <p class=\"sm\" style=\"margin-top: 6px; color: oklch(80% .12 22)\"><span style=\"font-weight: 650\">Blocker:<\/span> Blocked on sandbox keys again<\/p>\n          <\/div>\n          <div class=\"card\">\n            <div class=\"row\" style=\"gap: 12px\"><span class=\"av a6\">DM<\/span><div class=\"grow\"><p class=\"h3\">David<\/p><p class=\"xs mut\">90% this month · 7-day streak<\/p><\/div><span class=\"st st-sub\">Late<\/span><\/div>\n            <p class=\"sm\" style=\"margin-top: 12px\"><span class=\"mut\">Done:<\/span> Fixed the login redirect bug; reviewed 2 pull requests<\/p>\n          <\/div>\n          <sc-for list=\"{{ missed }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <div class=\"card row\" style=\"gap: 12px\">\n              <span class=\"{{ m.av }}\">{{ m.ini }}<\/span>\n              <div class=\"grow\"><p class=\"h3\">{{ m.name }}<\/p><p class=\"xs mut\">No summary yet<\/p><\/div>\n              <button class=\"{{ m.cls }}\" onClick=\"{{ m.nudge }}\">{{ m.label }}<\/button>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    const st = this.state || {};\n    const tab = st.tab || 'log', proj = st.proj || 'Standalone', nudged = st.nudged || {};\n    return {\n      cLog: tab === 'log' ? 'on' : '', cSum: tab === 'sum' ? 'on' : '',\n      toLog: () => this.setState({ tab: 'log' }), toSum: () => this.setState({ tab: 'sum' }),\n      showForm: tab === 'log' && !st.sent, sent: tab === 'log' && !!st.sent, isSum: tab === 'sum',\n      projs: ['Standalone', 'Customer Portal Revamp', 'Mobile App Launch'].map((name) => ({ name, cls: name === proj ? 'chip on' : 'chip', pick: () => this.setState({ proj: name }) })),\n      blk: !!st.blk, blkCls: st.blk ? 'toggle on' : 'toggle', toggleBlk: () => this.setState({ blk: !st.blk }),\n      submit: () => this.setState({ sent: true }),\n      missed: [['AE', 'Amaka', 'a4'], ['SJ', 'Sarah', 'a3']].map(([ini, name, a]) => ({ ini, name, av: 'av ' + a, label: nudged[ini] ? 'Nudged' : 'Nudge', cls: nudged[ini] ? 'btn btn-sm btn-sec' : 'btn btn-sm btn-ghost', nudge: () => this.setState({ nudged: { ...nudged, [ini]: true } }) }))\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Rewards.dc.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>How everyone is doing<\/title>\n<script src=\"./support.js\"><\/script>\n<link rel=\"stylesheet\" href=\"./tms.css\">\n<link rel=\"stylesheet\" href=\"./ws.css\">\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0}\n.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:6px}\n.pod{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}\n.pod .blk{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#161826}\n.crown{animation:floaty 3s ease-in-out infinite}\n.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:58px}\n.cheer{height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:transparent;font-size:12.5px;font-weight:650;cursor:pointer;color:var(--fg);transition:all .25s cubic-bezier(.34,1.56,.64,1);flex:none}\n.cheer.on{background:color-mix(in oklch,var(--st-sub) 18%,transparent);border-color:var(--st-sub);color:var(--st-sub);transform:scale(1.06)}\n<\/style>\n<\/helmet>\n<div class=\"app\">\n  <dc-import name=\"Theme\" ui=\"{{ false }}\" hint-size=\"0px,0px\"><\/dc-import>\n  <div class=\"top\">\n    <a href=\"FamilyHome.dc.html\" class=\"icon-btn\" aria-label=\"Back\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"m15 6-6 6 6 6\"><\/path><\/svg><\/a>\n    <div class=\"grow\"><h1 class=\"top-title\">Points &amp; rewards<\/h1><p class=\"xs mut\">How everyone is doing this week<\/p><\/div>\n  <\/div>\n  <div class=\"px\"><div class=\"seg\"><sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"2\"><button class=\"{{ t.cls }}\" onClick=\"{{ t.pick }}\">{{ t.name }}<\/button><\/sc-for><\/div><\/div>\n  <div class=\"scroll px\" style=\"padding-top: 16px; padding-bottom: 30px\">\n    <sc-if value=\"{{ board }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"card hero\" style=\"border: 0; text-align: center; padding: 20px 16px 16px\">\n        <div style=\"position: relative; z-index: 1\">\n          <p class=\"cd-l\">Star of the week<\/p>\n          <div class=\"podium\" style=\"margin-top: 16px\">\n            <div class=\"pod\"><span class=\"av a6\">AI<\/span><p class=\"xs\" style=\"color: #f3f5fe; font-weight: 650\">Ada · 40<\/p><div class=\"blk\" style=\"height: 56px; background: #c4bdf6\">2<\/div><\/div>\n            <div class=\"pod\"><svg class=\"crown\" viewBox=\"0 0 24 24\" style=\"width: 28px; height: 28px; fill: #eccb84; stroke: none\"><path d=\"M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z\"><\/path><\/svg><span class=\"av lg a3\" style=\"border: 3px solid #eccb84\">TI<\/span><p class=\"xs\" style=\"color: #f3f5fe; font-weight: 650\">Tobi · {{ tobi }}<\/p><div class=\"blk\" style=\"height: 84px; background: #eccb84\">1<\/div><\/div>\n            <div class=\"pod\"><span class=\"av a7\">BO<\/span><p class=\"xs\" style=\"color: #f3f5fe; font-weight: 650\">Bisi · 25<\/p><div class=\"blk\" style=\"height: 40px; background: #86d6cb\">3<\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"kpis\" style=\"grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px\">\n        <div class=\"kpi\" style=\"min-height: 76px; padding: 10px; cursor: default\"><p class=\"k-n num\" style=\"font-size: 20px\">5<\/p><p class=\"k-l\" style=\"font-size: 11px\">Chores done<\/p><\/div>\n        <div class=\"kpi\" style=\"min-height: 76px; padding: 10px; cursor: default\"><p class=\"k-n num\" style=\"font-size: 20px\">3<\/p><p class=\"k-l\" style=\"font-size: 11px\">School checked<\/p><\/div>\n        <div class=\"kpi\" style=\"min-height: 76px; padding: 10px; cursor: default\"><p class=\"k-n num\" style=\"font-size: 20px; color: var(--st-od)\">1<\/p><p class=\"k-l\" style=\"font-size: 11px\">Overdue<\/p><\/div>\n        <div class=\"kpi\" style=\"min-height: 76px; padding: 10px; cursor: default\"><p class=\"k-n num\" style=\"font-size: 20px; color: var(--st-sub)\">2<\/p><p class=\"k-l\" style=\"font-size: 11px\">On a streak<\/p><\/div>\n      <\/div>\n      <p class=\"eyebrow\" style=\"margin: 22px 0 10px\">Everyone<\/p>\n      <div class=\"list\">\n        <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"7\">\n          <div class=\"prow\">\n            <span class=\"xs dim num\" style=\"width: 14px\">{{ p.rank }}<\/span>\n            <span class=\"{{ p.av }}\">{{ p.ini }}<\/span>\n            <div class=\"grow\"><p class=\"h3\">{{ p.name }} <span class=\"xs mut\" style=\"font-weight: 500\">· {{ p.role }}<\/span><\/p><p class=\"xs mut\">{{ p.line }}<\/p><\/div>\n            <span class=\"pts-badge\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 3l2.4 5.6L20 9.5l-4.3 3.9 1.2 5.9L12 16.4l-4.9 2.9 1.2-5.9L4 9.5l5.6-.9z\"><\/path><\/svg>{{ p.pts }}<\/span>\n            <button class=\"{{ p.cheerCls }}\" onClick=\"{{ p.cheer }}\">{{ p.cheerTxt }}<\/button>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n    <sc-if value=\"{{ shop }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"card row\" style=\"gap: 14px\">\n        <span class=\"av lg a3\">TI<\/span>\n        <div class=\"grow\"><p class=\"h3\">Tobi has {{ tobi }} points<\/p><p class=\"xs mut\">Children trade points for rewards you set<\/p><\/div>\n      <\/div>\n      <div class=\"stack\" style=\"gap: 10px; margin-top: 14px\">\n        <sc-for list=\"{{ rewards }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div class=\"{{ r.cls }}\">\n            <span class=\"{{ r.tile }}\" style=\"width: 44px; height: 44px\"><svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"{{ r.icon }}\"><\/path><\/svg><\/span>\n            <div class=\"grow\"><p class=\"h3\">{{ r.name }}<\/p><div class=\"bar amber\" style=\"height: 5px; margin-top: 8px\"><i style=\"width: {{ r.w }}\"><\/i><\/div><p class=\"xs mut\" style=\"margin-top: 6px\">{{ r.line }}<\/p><\/div>\n            <sc-if value=\"{{ r.can }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"mini-btn pri\" onClick=\"{{ r.redeem }}\">Give<\/button><\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <button class=\"btn btn-sec btn-block\" style=\"margin-top: 14px\" onClick=\"{{ addReward }}\">+ Add a reward<\/button>\n    <\/sc-if>\n  <\/div>\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"toast\" role=\"status\"><span class=\"t-ic\"><svg class=\"i s\" viewBox=\"0 0 24 24\" style=\"stroke-width: 3\"><path d=\"m5 12 5 5 9-11\"><\/path><\/svg><\/span><span class=\"grow\">{{ toast }}<\/span><\/div>\n  <\/sc-if>\n  <dc-import name=\"TabBar\" kind=\"family\" active=\"more\" hint-size=\"390px,88px\"><\/dc-import>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  componentWillUnmount() { clearTimeout(this._t); }\n  renderVals() {\n    const st = this.state || {};\n    const tab = st.tab || 'board', cheered = st.cheered || {};\n    let tobi = st.tobi ?? 165;\n    const toast = (t) => { this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2400); };\n    const P = [\n      ['Tobi', 'Child', 'TI', 'a3', tobi, 'Chores 1/2 · School 2/5 · 1 overdue'], ['Ada', 'Child', 'AI', 'a6', 40, 'School 0/4 · redoing spelling'],\n      ['Bisi', 'Cook', 'BO', 'a7', 25, 'Chores 0/1 · market run'], ['Kwame', 'Driver', 'KM', 'a5', 10, 'Chores 0/1 · 1 errand'],\n      ['Funmi', 'Co-head', 'FI', 'a4', 0, 'Nothing assigned yet'], ['Ibrahim', 'Head', 'IM', 'a2', 0, 'Nothing assigned yet'], ['Sule',   renderVals() {
    const st = this.state || {};
    const P = { tobi: ['Tobi', 'TI', 'a3'], ada: ['Ada', 'AI', 'a6'], bisi: ['Bisi', 'BO', 'a7'], kwame: ['Kwame', 'KM', 'a5'], sule: ['Sule', 'SG', 'a8'] };
    const chores = st.chores || [
      { id: 1, name: 'Wash the plates after dinner', who: 'tobi', pts: 10, due: 'Today', s: 'todo' },
      { id: 2, name: 'Water the garden', who: 'tobi', pts: 5, due: 'Today', s: 'todo' },
      { id: 3, name: 'Iron school uniforms', who: 'bisi', pts: 0, due: 'Tomorrow', s: 'todo' },
      { id: 4, name: 'Wash the car', who: 'kwame', pts: 0, due: 'Fri, 27 Nov', s: 'ip' },
      { id: 5, name: 'Tidy your room', who: 'ada', pts: 10, due: 'Yesterday', s: 'done' }
    ];
    const f = st.f || 'all';
    const cnt = (s) => chores.filter((c) => s === 'all' || c.s === s).length;
    const doneN = cnt('done'), total = chores.length;
    const tobiPts = 140 + chores.filter((c) => c.who === 'tobi' && c.s === 'done').reduce((a, c) => a + c.pts, 0);
    const toast = (t) => { this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2400); };
    const cols = ['#9184d9', '#5fd3c4', 'oklch(85% .13 80)', '#f0a3b5', 'oklch(80% .11 245)', '#f3f5fe'];
    const d = st.d || { who: 'tobi', due: 'Today', pts: 10, text: '' };
    return {
      tabs: [['all', 'All'], ['todo', 'To do'], ['ip', 'In progress'], ['done', 'Done']].map(([k, name]) => ({ name, n: cnt(k), cls: k === f ? 'chip on' : 'chip', pick: () => this.setState({ f: k }) })),
      deg: Math.round(doneN / total * 360), doneN, total, tobiPts,

        toggle: () => {

          clearTimeout(this._b); this._b = setTimeout(() => this.setState({ burst: false }), 1300);
          if (nowDone) toast(c.pts ? P[c.who][0] + ' earned ' + c.pts + ' points' : 'Done · ' + c.name);
        }
      })),
      empty: cnt(f) === 0, burst: !!st.burst, gained: st.gained || 0,
      conf: Array.from({ length: 14 }, (_, i) => { const a = (i / 14) * Math.PI * 2, r = 70 + (i % 3) * 28; return { x: Math.round(Math.cos(a) * r), y: Math.round(Math.sin(a) * r), r: 160 + i * 41, c: cols[i % 6] }; }),

      dpts: d.pts, ptsUp: () => this.setState({ d: { ...d, pts: d.pts + 5 } }), ptsDown: () => this.setState({ d: { ...d, pts: Math.max(0, d.pts - 5) } }),
      save: () => {

    };
  }
